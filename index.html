<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Awesome Asshole — Private Mailroom</title>

<link rel="icon" type="image/png"
href="https://raw.githubusercontent.com/hnell1984-creator/awesomeasshole-assets/main/favicon.png">

<style>
:root{
  --bg:#0d0b10;
  --bg2:#131018;
  --panel:#111017;
  --purple:#7d35a0;
  --purple-bright:#a85bd0;
  --olive:#8a9d48;
  --olive-soft:#9bab62;
  --orange:#ff6b1a;
  --white:#f5f1f6;
  --muted:#9a92a0;
  --line:#3a3040;
}

*{
  box-sizing:border-box;
}

html{
  min-height:100%;
  background:var(--bg);
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;

  background:
    radial-gradient(
      circle at 50% 8%,
      rgba(125,53,160,.10),
      transparent 32%
    ),
    radial-gradient(
      circle at 50% 100%,
      rgba(138,157,72,.06),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      var(--bg),
      var(--bg2)
    );

  color:var(--white);
  font-family:Georgia,"Times New Roman",serif;
}

.card{
  width:min(560px,100%);

  background:rgba(17,16,23,.88);
  border:1px solid #332b39;
  box-shadow:0 28px 90px rgba(0,0,0,.45);
  border-radius:18px;

  padding:46px 42px 34px;

  text-align:center;
}

.mark{
  width:110px;
  height:110px;
  object-fit:contain;
  margin:0 auto 20px;
  display:block;
}

.eyebrow{
  margin:0 0 12px;

  color:var(--purple-bright);

  font:700 10px/1.3 Arial,sans-serif;
  letter-spacing:2px;
  text-transform:uppercase;
}

h1{
  margin:0;

  color:var(--white);

  font:400 clamp(38px,8vw,62px)/.95 Arial,sans-serif;
  letter-spacing:-3px;
  text-transform:uppercase;
}

h1 span{
  color:var(--purple-bright);
}

.subtitle{
  margin:22px 0 32px;

  color:var(--muted);

  font-size:16px;
  line-height:1.5;
}

.rule{
  width:70px;
  height:1px;

  margin:0 auto 28px;

  background:var(--olive);
}

.organisation{
  margin:0 0 30px;

  color:var(--olive-soft);

  font:700 10px/1.5 Arial,sans-serif;
  letter-spacing:1.7px;
  text-transform:uppercase;
}

.enter{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:14px;

  min-height:48px;
  padding:0 24px;

  color:var(--white);
  background:rgba(125,53,160,.12);

  border:1px solid #685570;
  border-radius:6px;

  text-decoration:none;

  font:700 10px/1 Arial,sans-serif;
  letter-spacing:1.8px;
  text-transform:uppercase;

  transition:.15s ease;
}

.enter:hover{
  background:rgba(125,53,160,.22);
  border-color:var(--purple-bright);
}

.enter span{
  color:var(--purple-bright);
  font-size:16px;
}

.footer{
  margin-top:36px;
  padding-top:18px;

  border-top:1px solid var(--line);

  color:var(--muted);

  font:9px/1.5 Arial,sans-serif;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

@media(max-width:600px){
  .card{
    padding:42px 24px 32px;
  }

  .mark{
    width:96px;
    height:96px;
  }
}
</style>
</head>

<body>

<main class="card">

  <img
    class="mark"
    src="https://raw.githubusercontent.com/hnell1984-creator/awesomeasshole-assets/main/aa-logo.png"
    alt="Awesome Asshole">

  <p class="eyebrow">
    Awesome Asshole / Private Mailroom
  </p>

  <h1>
    PRIVATE<br>
    <span>MAILROOM</span>
  </h1>

  <p class="subtitle">
    Official correspondence for matters of questionable importance.
  </p>

  <div class="rule"></div>

  <p class="organisation">
    DÖHNEHEIM &amp; HENDASMERE
  </p>

  <a
    class="enter"
    href="https://webmail.awesomeasshole.co.za/">
    ENTER MAILROOM <span>→</span>
  </a>

  <div class="footer">
    Authorised personnel only<br>
    Private Archive Administration
  </div>

</main>

</body>
</html>
